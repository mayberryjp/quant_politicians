[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-politicians"
version = "0.1.0"
description = "Ingest US congressional financial disclosures, extract trades via a local LLM, and publish signals to quant_signals"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bottle>=0.13.0",
    "psycopg[binary]>=3.1",
    "redis[hiredis]>=5.0.0",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "waitress>=3.0",
    "httpx>=0.27",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "webtest>=3.0.0",
    "fakeredis[json]>=2.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
