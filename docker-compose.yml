services:
  quant_politicians:
    container_name: quant_politicians
    image: mayberry4477/quant_politicians:latest
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgresql+psycopg://quant:quant_dev_password@postgres:5432/quant
      - QUANT_REDIS_URL=redis://quant_redis.quant.mayberry.farm:6379/0
      - API_PORT=8017
      - POLL_INTERVAL=3600
      - HOUSE_FD_BASE_URL=https://disclosures-clerk.house.gov
      - HOUSE_FD_YEARS=current
      - TARGET_FILING_TYPES=P
      - PUBLISH_TRANSACTION_TYPES=purchase
      # Vision-capable model is REQUIRED (no default) before extraction slices run.
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=
      - SIGNALS_API_URL=
      - SIGNALS_SOURCE_NAME=house-disclosures-v1
    ports:
      - "8017:8017"
